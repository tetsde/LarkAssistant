[project]
name = "server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "lark-oapi>=1.7.3",
    "motor>=3.7.1",
    "pydantic>=2.14.0",
    "pymongo>=4.18.3",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
    "grpcio>=1.68.0",
    "protobuf>=5.29.0",
    "cryptography>=50.0.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "anyio>=4.15.1",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
