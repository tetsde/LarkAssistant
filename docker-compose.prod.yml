# ==============================================================================
# HiLark Enterprise AI Assistant - Production Docker Compose Stack
# ==============================================================================
# Khởi chạy toàn bộ hệ thống sản xuất với mạng nội bộ an toàn (hilark-network).
# Kết nối liền mạch với WeKnora On-premise Vault & MongoDB nội bộ.
# ==============================================================================

networks:
  hilark-network:
    name: hilark-network
    driver: bridge

volumes:
  hilark-mongo-data:
    name: hilark-mongo-data
  hilark-logs:
    name: hilark-logs

services:
  # ----------------------------------------------------------------------------
  # 1. Cơ sở dữ liệu nội bộ HiLark (MongoDB 7.0 Enterprise-ready)
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: hilark-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGO_PORT:-27018}:27017"
    volumes:
      - hilark-mongo-data:/data/db
    networks:
      - hilark-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ----------------------------------------------------------------------------
  # 2. HiLark FastAPI Backend & Lark Bot Service
  # ----------------------------------------------------------------------------
  hilark-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: hilark/server:latest
    container_name: hilark-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Không nhúng credential thật vào file này: chuỗi Atlas từng nằm trong lịch sử Git
      # nên mật khẩu phải được đổi và chỉ được lấy từ .env trên máy deploy.
      # Cú pháp `:?` làm `docker compose` fail ngay khi khởi động nếu biến chưa được set,
      # thay vì âm thầm chạy bằng DB của môi trường khác.
      - MONGO_URL=${MONGO_URL:?MONGO_URL chưa được set trong .env của máy deploy}
      - MONGODB_URI=${MONGODB_URI:?MONGODB_URI chưa được set trong .env của máy deploy}
      - MONGO_DB=${MONGO_DB:-LarkAssistant}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:8000}
      - BASE_URL=${DOCKER_WEKNORA_BASE_URL:-http://host.docker.internal/api/v1}
      - DOCREADER_GRPC_HOST=${DOCREADER_GRPC_HOST:-host.docker.internal}
      - DOCREADER_GRPC_PORT=${DOCREADER_GRPC_PORT:-50051}
      - WEKNORA_API_KEY=${WEKNORA_API_KEY:-${api_weknora:-}}
      - api_weknora=${api_weknora:-${WEKNORA_API_KEY:-}}
    volumes:
      - hilark-logs:/app/logs
    networks:
      - hilark-network
    depends_on:
      mongodb:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
